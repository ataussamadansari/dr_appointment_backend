name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Render Deploy Hook secret
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "❌ ERROR: RENDER_DEPLOY_HOOK_URL secret is not set!"
            echo "Go to: GitHub Repo → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: Trigger Render Deploy Hook
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/render_response.txt -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render response status: $HTTP_STATUS"
          cat /tmp/render_response.txt
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "❌ Render deploy hook failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Render deploy triggered successfully!"
